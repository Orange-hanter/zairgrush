[project]
name = "swarm"
version = "0.1.0"
description = "Оркестратор петли агентов: исполнитель ↔ ревьюер"
requires-python = ">=3.11"

# Линт и типы настроены СТРОГО и намеренно поздно: до этого единственным
# гейтом были тесты, и весь класс дефектов «оно работает, пока не придёт
# None» держался на внимательности. Внимательность за сессию промахнулась
# трижды, поэтому проверка передаётся машине.
#
# Правило ужесточения: список игнорируемых правил только сокращается.
# Каждая строка в `ignore` — долг с объяснением, а не разрешение.

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["swarm", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes: неиспользованное, неопределённое
    "I",           # порядок импортов
    "B",           # bugbear: настоящие ловушки, а не стиль
    "C4",          # comprehensions
    "UP",          # устаревшие конструкции
    "SIM",         # упрощения
    "RET",         # возвраты
    "ARG",         # неиспользуемые аргументы
    "PTH",         # os.path -> pathlib
    "RUF",         # правила самого ruff
    "S",           # bandit: безопасность
    "T20",         # print вне CLI
    "TRY",         # обработка исключений
    "EM",          # сообщения исключений
    "N",           # имена
    "BLE",         # никаких `except Exception` без объяснения
    "PLC", "PLE", "PLW",  # pylint: в т.ч. subprocess без явного check
    "SLF",         # обращение к приватным членам чужих объектов
    "PGH",         # бланковые noqa и type: ignore
    "G", "LOG",    # корректное и ленивое логирование
    "PERF", "FURB", "PIE", "RSE", "C4",  # лишняя работа и лишний код
    "ISC",         # неявная склейка строк (класс «забытая запятая»)
    "DTZ",         # наивное время
    "A", "FA", "YTT", "SLOT", "TID", "TC", "Q", "EXE", "INP",
]
ignore = [
    # RUF001/002/003 ловят кириллицу, похожую на латиницу. Язык проекта —
    # русский (CLAUDE.md), поэтому правило не применимо, а не ослаблено:
    # оно давало 814 срабатываний из 1013 на буквы «а», «е», «о», «с».
    "RUF001", "RUF002", "RUF003",
    # subprocess — суть инструмента: он запускает агентов и git. Запрет
    # тут означал бы запрет на существование.
    "S603", "S607",
    # Русские сообщения в исключениях — язык проекта (CLAUDE.md).
    "EM101", "EM102", "TRY003",
    # `print` — единственный интерфейс CLI; в swarm/cli.py он уместен.
    # Ограничено адресно ниже, а не глобально.
]

# --- порог, а не запрет ------------------------------------------------
# PLR/C901 (сложность, число веток, магические числа) НЕ включены: замер
# показал 7 функций сверх порога, и все семь — конечный автомат петли и
# разбор конверта агента. Расщеплять их ради метрики значит менять код в
# угоду цифре. Правила ждут отдельной задачи о рефакторинге run_task, а
# не тихого попадания в ignore.

[tool.ruff.lint.per-file-ignores]
# CLI разговаривает с человеком через stdout: print здесь не долг.
# SLF001 — долг декомпозиции cli.py на плоские модули (clirun, cliexplain
# и др.): тесты патчат `cli._load` / `cli.loop_mod`, поэтому подмодули
# обращаются к приватным хелперам cli по имени. Снятие долга = переименование
# общих хелперов в публичные с синхронной правкой тестов — отдельная задача.
"swarm/cli*.py" = ["T20", "SLF001"]
"swarm/planner.py" = ["T20"]
# board.py — единственный файл, где в строковых литералах живут CSS и JS
# дашборда. E501 там мерил бы длину НЕ-Python-текста, а перенос строки
# внутри шаблона меняет то, что попадает в HTML. Долг ограничен одним
# правилом в одном файле; Python-строки в нём проверяются как везде.
"swarm/board.py" = ["E501"]
# Тесты: assert — их суть; длинные фикстуры и «магические» значения тоже.
"tests/*" = [
    "S101",                        # assert — суть теста
    "ARG001", "ARG002", "ARG005",  # подставные агенты обязаны повторять
                                   # подпись настоящих: неиспользованный
                                   # аргумент здесь — контракт, а не мусор
    "RUF012",                      # фикстуры уровня класса (TASK, QUEUE)
                                   # — данные теста, ClassVar не добавляет
                                   # смысла там, где типов нет вовсе
    "N805",                        # вложенные классы-заглушки берут первым
                                   # аргументом `inner`, чтобы `self` остался
                                   # тестом снаружи замыкания
    "SLF001",                      # тест обязан смотреть внутрь: он
                                   # проверяет инварианты реализации,
                                   # а не только публичный контракт
    "PLC0415",                     # модули грузятся по путям в самом
                                   # тесте — это его setup, не импорт
    "EXE001",                      # тесты запускает pytest, не шелл
    "T20", "N802", "PTH123",
]

[tool.mypy]
python_version = "3.11"
files = ["swarm"]
strict = true
# Модули грузятся через importlib по путям (см. `_load`), поэтому
# межмодульные импорты mypy не видит — это осознанная плата за то, что
# оркестратор работает без установки пакета.
ignore_missing_imports = true
warn_unreachable = true
warn_no_return = true
disallow_any_explicit = false
show_error_codes = true

[[tool.mypy.overrides]]
# tree-sitter — опциональная зависимость: индекс работает и без неё.
module = ["tree_sitter", "tree_sitter_python", "tree_sitter_rust"]
ignore_missing_imports = true
