# docmap.toml — E5, вариант B: карта «код → секции документов».
#
# Формат (stdlib tomllib):
#   [[map]]
#   code = "путь/или/glob/**"            # от корня репо, fnmatch-синтаксис
#   docs = ["файл.md", "файл.md#якорь"]  # якорь — подстрока заголовка markdown
#
# Механика: изменился файл, покрытый `code`, → перечисленные секции
# ПОДОЗРЕВАЕМЫ на рассинхрон. Детект полностью механический, LLM нужен
# только чтобы сформулировать правку (эта часть — отдельно и за флагом).
# Саму карту тоже проверяет машина: glob без совпадений, несуществующий
# документ, якорь, которого нет ни в одном заголовке, — всё это warning
# (`swarm docmap`). Секция без владельца-кода в карте не появляется —
# она просто не покрыта, и это видно по пустому suspects на её правках.

