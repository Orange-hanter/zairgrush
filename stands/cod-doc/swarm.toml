# ═══ Стенд cod-doc для роя ZAIrgRush ═════════════════════════════════════
#
# Конфиг прогона петли. Файл принадлежит ПЕТЛЕ и оператору (OWNED_ROOTS в
# tools/swarm/swarm/state.py): страж границ его не судит, revert/commit/
# stash не трогают, ревьюер не видит его диффа. Правка на ходу переживёт
# прогон, но подействует только со следующего запуска процесса.
#
# Эталон и порядок развёртывания стенда живут в ZAIrgRush:
# stands/cod-doc/ (swarm.toml + README.md).

# ── Гейт: то, что делает работу принятой ─────────────────────────────────
# Ровно четыре шага CI cod-doc (.github/workflows/ci.yml) и в том же
# порядке: дешёвое и локальное раньше дорогого — падение на линте
# экономит прогон тестов. Всё, что упадёт в CI, обязано падать здесь:
# требование, которое исполнитель не может проверить сам, превращает
# ревью в бесконечный круг.
#
# Две тонкости cod-doc, обе из его CLAUDE.md:
#   * `env -u FORCE_COLOR` — rich красит вывод CLI в CliRunner, и
#     строковые ассерты падают на ANSI-кодах;
#   * `.venv` — СОБСТВЕННЫЙ venv стенда, а не симлинк на основной
#     чекаут. Симлинк не попадает под `.venv/` в .gitignore (слэш
#     требует каталога) и уехал бы в `git add -A` петли; а общий venv
#     ставит cod-doc editable-ссылкой на ЧУЖИЕ исходники — гейт судил бы
#     не тот код, который правил исполнитель.
gate_command = ["sh", "-c", "set -e; .venv/bin/ruff check cod_doc/ tests/; .venv/bin/ruff format --check cod_doc/ tests/; .venv/bin/mypy cod_doc/; env -u FORCE_COLOR .venv/bin/pytest tests/ -q --tb=short --timeout=120"]

# Замер 2026-08-26 (MacBook Pro M1, 8 ГБ): весь гейт — 6 мин 59 с,
# 1388 passed. Потолок взят с запасом ×6, потому что цена ошибки
# несимметрична: короткий таймаут объявляет аварией задачу, которая
# просто медленно считалась, и это стоит раунда. Машина под прогоном
# роя вдобавок занята агентами.
gate_timeout = 2700

# ── Границы: что считается ЧУЖИМ ─────────────────────────────────────────
# Защита снимается, только если `paths` задачи целятся в файл ЯВНО
# (широкий глоб вроде `cod_doc/**` защиту НЕ снимает). Это не запрет, а
# требование назвать намерение вслух.
protected_paths = [
    # Анти-gaming: исполнитель не переписывает чужой тест, чтобы гейт
    # позеленел. Своя проверка у задачи типа feature-tests легализуется
    # тем, что планировщик называет её путь в paths.
    "tests/*",
    "tests/**",
    # Ratchet-список ruff (`per-file-ignores`) может только СОКРАЩАТЬСЯ —
    # это закон cod-doc (docs/system/standards/code-quality.md). Самый
    # дешёвый способ пройти линт — дописать себе исключение; здесь это
    # стоит явного упоминания в границах задачи.
    "pyproject.toml",
    # Миграции: симметричные upgrade/downgrade и линейная цепочка
    # ревизий. Миграция, придуманная попутно, ломает `alembic heads`
    # тихо и надолго.
    "cod_doc/infra/migrations/versions/**",
    "alembic.ini",
    # Реестр хэшей файлов: правится не руками, а `cod-doc hash update`.
    "MASTER.md",
    # Гейт не имеет права править сам себя.
    ".github/workflows/**",
    # Закон репозитория: он на входе у исполнителя, а не в его выдаче.
    "CLAUDE.md",
    "AGENTS.md",
]

# ── Круг работы ──────────────────────────────────────────────────────────
confirmations = 2         # подтверждений чистым ревью перед закрытием задачи
max_iterations = 3        # раундов исправлений (подтверждение их не тратит)
max_futile_rounds = 4     # потолок сорвавшихся раундов: авария исполнителя,
                          # откат по границам, разъехавшиеся сигнатуры
verification = "milestone"  # проверки исполнением: never | milestone | always
map_budget = 25           # символов в карте репозитория для handoff

# ── Кем исполнять ────────────────────────────────────────────────────────
# Умолчание роя и осознанный выбор здесь: дифф пишет kimi (K3), судит
# claude. Независимость судьи — несущая опора разделения ролей, и на
# одном семействе моделей она исчезает. Переключение на claude — две
# строки ниже; тогда разводите роли через confirm_model/confirm_lens.
executor_engine = "kimi"

# ── Деньги ───────────────────────────────────────────────────────────────
# Режим по умолчанию — money_bin: неявных потолков на вызов роли нет.
# Потолок ПРОГОНА неявным не бывает ни в одном режиме — сколько стоит
# цель, решает оператор. 20 долларов здесь — стартовое значение для
# первых прогонов на cod-doc, а не рекомендация.
spending = "money_bin"
total_budget_usd = 20.0

# ── Наблюдаемость ────────────────────────────────────────────────────────
live_board = true         # .swarm/board.html перестраивается после раунда
board_port = 7433         # занят — сервер возьмёт свободный
